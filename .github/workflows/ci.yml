name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Same command the team uses on laptops: install the exact pnpm from
      # package.json "packageManager" (e.g. pnpm@10.34.6) as a plain JS
      # package from npm. Never the @pnpm/exe native build.
      - name: Install pnpm
        shell: bash
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install (frozen lockfile, install scripts blocked)
        run: pnpm install --frozen-lockfile

      - name: Verify no native binaries
        run: pnpm verify:no-native

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Dataverse schema plan (dry run)
        run: pnpm dataverse:plan

      - name: Build
        run: pnpm build

      - name: Dev server smoke test
        run: pnpm smoke:dev

      # Re-install as if on a Windows x64/arm64 laptop and re-check. Catches
      # Windows-only optional/platform packages from the Linux runner too.
      - name: Windows-targeted install check
        if: runner.os == 'Linux'
        run: |
          pnpm install --force --frozen-lockfile \
            --config.supportedArchitectures.os=win32 \
            --config.supportedArchitectures.cpu=x64 \
            --config.supportedArchitectures.cpu=arm64
          pnpm verify:no-native
